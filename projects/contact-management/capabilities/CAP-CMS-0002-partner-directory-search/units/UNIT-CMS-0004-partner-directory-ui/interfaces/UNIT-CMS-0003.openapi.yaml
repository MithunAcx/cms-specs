openapi: 3.1.0
info:
  title: Partner Search API (UNIT-CMS-0003) — consumed contract
  version: "1.0.0"
  description: >
    Read-only search across brokerages, brokers, agencies, and CGAs.
    Cross-capability read against CAP-CMS-0003's data (XD-0002); this
    producer owns no data of its own. Consumed here by
    UNIT-CMS-0004-partner-directory-ui.

servers:
  - url: /api/v1
    description: >
      Concrete host is unresolved — owned by the engineering repo's
      environment configuration, never named in this spec tree.

security:
  - bearerAuth: []

paths:
  /search:
    get:
      operationId: searchPartners
      summary: Run one of the six directory search modes.
      description: >
        Satisfies R2, R3, R4, R5, R6, R7, R9, R10, R12 (UNIT-CMS-0004).
        Mode selects which fields are matched (XD-0001); term/state/uw are
        shared parameters interpreted per mode. term is required for
        mode in {brokerage, broker, agency, cga}; state is required for
        mode in {state-broker, state-agent}.
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [brokerage, broker, state-broker, agency, cga, state-agent]
          description: Selects the search mode (capability.md FR-SEARCH-1).
        - name: term
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: >
            Required when mode is brokerage, broker, agency, or cga;
            ignored for state-broker/state-agent.
        - name: state
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 2 }
          description: >
            Required when mode is state-broker or state-agent (two-letter
            state code); ignored otherwise.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Search results for the given mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
              example:
                items:
                  - id: "01926a3e-1f2b-7c8d-9e0a-1b2c3d4e5f6a"
                    kind: brokerage
                    brokerage: "Acme Brokerage LLC"
                    address: "123 Main St, Springfield, IL 62704"
                    assigned_uw: "J. Rivera"
                    state: "IL"
                total: 1
                page: 1
                size: 25
        "400":
          description: >
            Missing a required parameter for the given mode (e.g. term
            absent for mode=brokerage). Satisfies R3/R4's server-side
            backstop behind this unit's own client-side validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: validation_error
                  message: "term is required for mode=brokerage"
        "401":
          description: Unauthenticated request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated but below the Viewer minimum role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Rate-limited by API Gateway throttling (stack.md). Retry-After
            header present.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lookups/assigned-uws:
    get:
      operationId: listAssignedUnderwriters
      summary: List underwriters currently assigned to at least one brokerage.
      description: >
        Satisfies R5 (UNIT-CMS-0004). Free-text values, not a managed
        lookup (capability.md, intake Q7).
      responses:
        "200":
          description: Distinct underwriters currently in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignedUwList" }
              example:
                - uw: "J. Rivera"
                - uw: "M. Chen"
        "401":
          description: Unauthenticated request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated but below the Viewer minimum role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate-limited by API Gateway throttling (stack.md).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected server-side failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Self-issued JWT (stack.md) — no external IdP, no OAuth2 flow.

  schemas:
    SearchResultItem:
      type: object
      description: >
        Shape varies by the mode that produced it; fields not applicable to
        a given mode are absent (nullability is per-mode, not a single
        fixed shape — see the capability's mode table for the column set
        each mode returns).
      required: [id, kind]
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 entity id (10-platform.md).
        kind:
          type: string
          enum: [brokerage, broker, agency, cga]
        brokerage: { type: string, nullable: true }
        address: { type: string, nullable: true }
        assigned_uw: { type: string, nullable: true }
        state: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        title_type: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        disabled: { type: boolean, nullable: true }
        agency: { type: string, nullable: true }
        agent: { type: string, nullable: true }
        cga_agent: { type: string, nullable: true }

    SearchResponse:
      type: object
      required: [items, total, page, size]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchResultItem" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }

    AssignedUwList:
      type: array
      items:
        type: object
        required: [uw]
        additionalProperties: false
        properties:
          uw: { type: string }

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "stable machine-readable code, snake_case" }
            message: { type: string }
            fields:
              type: array
              items: { type: string }
              description: Field names implicated in a validation_error, if any.
