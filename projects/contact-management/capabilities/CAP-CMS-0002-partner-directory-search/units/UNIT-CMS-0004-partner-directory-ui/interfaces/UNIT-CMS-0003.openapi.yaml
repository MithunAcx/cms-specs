# against.
#
# ACTION REQUIRED once UNIT-CMS-0003 reaches `designed`: re-copy this file
# VERBATIM from UNIT-CMS-0003/interfaces/openapi.yaml. Any disagreement
# between the two is staleness, fixed by re-copying — never by patching
