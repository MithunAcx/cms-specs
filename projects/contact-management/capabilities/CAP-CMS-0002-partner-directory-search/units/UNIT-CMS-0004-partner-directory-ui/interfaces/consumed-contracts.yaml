# Consumed contracts — UNIT-CMS-0004-partner-directory-ui
#
# This unit exposes no API of its own (capability-design.md: U2 owns "nothing of
# its own"). It consumes UNIT-CMS-0003's read-only search endpoints as a closed
# shape. This file is authored prose; the local copy below it is a mirror, never
# hand-edited.

consumes:
  - unit: UNIT-CMS-0003
    capability: CAP-CMS-0002
    why: >
      Every search mode (R2-R10, R12) and the Assigned Underwriter filter (R5)
      are answered entirely by UNIT-CMS-0003's /api/v1/search and
      /api/v1/lookups/assigned-uws operations. This unit performs no query
      logic, filtering, or data access of its own.
    generated_from:
      source: ./UNIT-CMS-0003.openapi.yaml   # local copy in this same folder
      note: >
        Re-copied verbatim from UNIT-CMS-0003/interfaces/openapi.yaml on
        2026-08-19, now that unit has authored its own contract (resolves
        Q2 below). This copy also carries UNIT-CMS-0003's platform-floor
        pagination fix: page/size (offset) replaced with cursor-based
        limit/cursor in, next_cursor out. Any future disagreement between
        the two files is staleness, fixed by re-copying — never by patching
        either file to match the other (shared-spec-conventions;
        ba-spec-validate I11).
    operations_used:
      - operationId: searchPartners
        path: GET /api/v1/search
        used_for: R2, R3, R4, R5, R6, R7, R9, R10, R12
      - operationId: listAssignedUnderwriters
        path: GET /api/v1/lookups/assigned-uws
        used_for: R5

error_handling:
  - code: term_required / state_required / invalid_request / cursor_invalid (HTTP 400)
    user_visible_outcome: >
      Surfaced as the inline validation message on the offending field
      (R3/R4) — but note this unit's own client-side validation (design.md
      Cross-cutting/validation) should prevent most 400s from ever being
      sent; a 400 that does arrive is treated the same as the client-side
      case. cursor_invalid cannot occur from this unit's own usage, since it
      never constructs a cursor itself — only replays a `next_cursor` UNIT-CMS-0003
      issued — but is enumerated here because it is part of the consumed contract.
  - code: unauthenticated (HTTP 401)
    user_visible_outcome: >
      Routes to the session guard's re-authentication flow (R25). Below-Viewer
      role gating (R17/R18) is enforced by this unit reading the session's own
      role — UNIT-CMS-0003's contract does not itself model a 403; a role check
      failing does not send the request at all.
  - code: rate_limited (HTTP 429)
    user_visible_outcome: >
      Rate-limited state per R23; Retry-After honoured before any automatic
      retry, manual retry always available.
  - code: any 5xx / network failure / timeout
    user_visible_outcome: >
      Retryable error state (R21), distinct from the empty-result state
      (R8); search input preserved for retry.

open_questions:
  - id: Q2
    question: >
      Re-copy UNIT-CMS-0003.openapi.yaml verbatim from UNIT-CMS-0003's own
      interfaces/openapi.yaml once that unit authors it, and confirm no
      shape drift against this constructed version.
    owner: "@MithunAcx"
    status: >
      Resolved 2026-08-19 — UNIT-CMS-0003 has authored its own
      interfaces/openapi.yaml; this file is now a verbatim re-copy of it
      (see generated_from note above).
