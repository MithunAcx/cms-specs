openapi: 3.1.0
info:
  title: Activity API (consumed contract — derived copy)
  version: 1.0.0
  description: >
    Consumed by UNIT-CMS-0008-activity-grid-ui. Owned and authored by
    UNIT-CMS-0007-activity-api; derived here from CAP-CMS-0004's
    capability-design.md pending that unit's own publication. Do not hand-edit —
    see the file header.
servers:
  - url: "{unresolved}"
    description: >
      Concrete host/base path not supplied by any project artifact as of this
      writing. UNIT-CMS-0007-activity-api's own interfaces/openapi.yaml is the
      owner of this value once published.
    variables:
      unresolved:
        default: UNRESOLVED
security:
  - bearerAuth: []
paths:
  /api/v1/activity:
    get:
      operationId: listActivity
      summary: List activity entries for one parent
      description: >
        Satisfies R1, R2, R3, R29 (UNIT-CMS-0008). Excludes soft-deleted entries
        by default (XD-0002, CAP-CMS-0004/capability-design). Requires role Viewer
        or above.
      security:
        - bearerAuth: ["activity:activity.read"]
      parameters:
        - name: parentType
          in: query
          required: true
          schema:
            type: string
            enum: [agency, brokerage]
        - name: parentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: completed
          in: query
          required: false
          description: Filter by completed/open state.
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: Sort field; only followUpDate is defined today.
          schema:
            type: string
            enum: [followUpDate]
            default: followUpDate
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A page of activity entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                  page:
                    type: integer
                    format: int32
                    minimum: 1
                  size:
                    type: integer
                    format: int32
                    minimum: 1
              examples:
                default:
                  value:
                    items:
                      - id: "018f6e2a-6f2a-7c3e-9a2b-000000000001"
                        parentType: brokerage
                        parentId: "018f6e2a-6f2a-7c3e-9a2b-0000000000aa"
                        statusId: 2
                        note: "Called to confirm renewal timeline."
                        followUpDate: "2026-09-01"
                        enteredDate: "2026-08-19T14:02:00Z"
                        completed: false
                        completedDate: null
                        userName: "jsmith"
                    total: 1
                    page: 1
                    size: 25
        "401":
          description: Caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createActivity
      summary: Create a new activity entry
      description: >
        Satisfies R4, R5, R9 (UNIT-CMS-0008). `userName` and `enteredDate` are
        server-derived (XD-0003); the request body accepts neither. Requires role
        Editor.
      security:
        - bearerAuth: ["activity:activity.write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreateRequest"
            examples:
              default:
                value:
                  parentType: brokerage
                  parentId: "018f6e2a-6f2a-7c3e-9a2b-0000000000aa"
                  statusId: 2
                  note: "Called to confirm renewal timeline."
                  followUpDate: "2026-09-01"
      responses:
        "201":
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Validation failure (e.g. statusId not valid for this parent type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/activity/{id}:
    put:
      operationId: updateActivity
      summary: Update an existing activity entry, including marking it complete
      description: >
        Satisfies R6, R7, R9 (UNIT-CMS-0008). Idempotent by resource id (fixed
        convention, capability-design.md). Setting `completed: true` causes the
        server to set `completedDate`; the request body accepts no
        `completedDate` field. Requires role Editor.
      security:
        - bearerAuth: ["activity:activity.write"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdateRequest"
            examples:
              markComplete:
                value:
                  statusId: 2
                  note: "Called to confirm renewal timeline."
                  followUpDate: "2026-09-01"
                  completed: true
      responses:
        "200":
          description: Entry updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Entry does not exist (never existed — a soft-deleted entry is not a 404 target for this operation per XD-0002; see UNIT-CMS-0007's own contract once published).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteActivity
      summary: Soft-delete an activity entry
      description: >
        Satisfies R8, R9, R16 (UNIT-CMS-0008). Soft delete (XD-0002) — sets
        `deletedAt` server-side, row retained. Idempotent: deleting an
        already-deleted entry returns 204 as a no-op, not 404. Requires role
        Editor.
      security:
        - bearerAuth: ["activity:activity.write"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Entry soft-deleted (or already was — idempotent no-op).
        "401":
          description: Caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Entry never existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Self-issued JWT per projects/contact-management/stack.md — no external
        IdP, no OAuth2 flow. Scopes named activity:activity.read /
        activity:activity.write per 10-platform.md's <domain>:<resource>.<action>
        convention.
  schemas:
    Activity:
      type: object
      additionalProperties: false
      required:
        - id
        - parentType
        - parentId
        - statusId
        - note
        - followUpDate
        - enteredDate
        - completed
        - completedDate
        - userName
      properties:
        id:
          type: string
          format: uuid
        parentType:
          type: string
          enum: [agency, brokerage]
        parentId:
          type: string
          format: uuid
        statusId:
          type: integer
          format: int32
          description: Controlled list scoped to parentType (TskType_ID = 2), owned by CAP-CMS-0003's reference-lookup scope.
        note:
          type: string
          description: Free text. Personal data; may incidentally contain special-category content.
        followUpDate:
          type: string
          format: date
          description: Date-only, no time-of-day or timezone component.
        enteredDate:
          type: string
          format: date-time
          description: Server-set on create. UTC RFC 3339.
        completed:
          type: boolean
        completedDate:
          type: [string, "null"]
          format: date-time
          description: Server-set the moment `completed` transitions to true. UTC RFC 3339. Null while open.
        userName:
          type: string
          description: Server-derived from the authenticated request (XD-0003). Never client-writable.
      example:
        id: "018f6e2a-6f2a-7c3e-9a2b-000000000001"
        parentType: brokerage
        parentId: "018f6e2a-6f2a-7c3e-9a2b-0000000000aa"
        statusId: 2
        note: "Called to confirm renewal timeline."
        followUpDate: "2026-09-01"
        enteredDate: "2026-08-19T14:02:00Z"
        completed: false
        completedDate: null
        userName: "jsmith"
    ActivityCreateRequest:
      type: object
      additionalProperties: false
      required: [parentType, parentId, statusId, note, followUpDate]
      properties:
        parentType:
          type: string
          enum: [agency, brokerage]
        parentId:
          type: string
          format: uuid
        statusId:
          type: integer
          format: int32
        note:
          type: string
        followUpDate:
          type: string
          format: date
    ActivityUpdateRequest:
      type: object
      additionalProperties: false
      required: [statusId, note, followUpDate, completed]
      properties:
        statusId:
          type: integer
          format: int32
        note:
          type: string
        followUpDate:
          type: string
          format: date
        completed:
          type: boolean
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      description: >
        Error shape as fixed by CAP-CMS-0004/capability-design.md's shared
        conventions table: { error: { code, message, fields? } }. Note this
        differs from 10-platform.md's repo-wide { code, message, details[],
        trace_id } envelope; that divergence was already fixed at
        capability-design time, before this unit existed, and is not
        reopened here.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, snake_case.
            message:
              type: string
              description: Human-readable, never parsed, never personal data.
            fields:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
      example:
        error:
          code: validation_failed
          message: "statusId is not valid for this parent type"
          fields:
            - field: statusId
              code: invalid_status_for_parent
