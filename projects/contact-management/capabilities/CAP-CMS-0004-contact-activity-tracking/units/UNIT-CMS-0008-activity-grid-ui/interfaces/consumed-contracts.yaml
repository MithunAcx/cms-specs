# What UNIT-CMS-0008-activity-grid-ui consumes, why, and how every error code
# maps to a user-visible outcome. Authored prose — not machine-generated, and not
# itself a contract; the contract is the copy(-in-progress) alongside it.
unit: UNIT-CMS-0008
updated: 2026-08-19

consumes:
  - producer: UNIT-CMS-0007-activity-api
    why: >
      Owns the Activity entity end to end (list/create/update/soft-delete). This
      unit renders and drives every one of those four operations but persists
      nothing itself — see design.md § Approach.
    contract_file: UNIT-CMS-0007.openapi.yaml
    generated_from:
      source: "./UNIT-CMS-0007.openapi.yaml"
      status: >
        COPIED VERBATIM from UNIT-CMS-0007-activity-api/interfaces/openapi.yaml
        on 2026-08-19, now that UNIT-CMS-0007 has published its own contract
        (PR #50). Re-copy whenever that file changes; never hand-patch this
        file to reconcile a disagreement (ba-spec-validate I11).
    operations_used:
      - operationId: listActivity
        satisfies: [R1, R2, R3, R29]
      - operationId: createActivity
        satisfies: [R4, R5, R9]
      - operationId: updateActivity
        satisfies: [R6, R7, R9]
      - operationId: softDeleteActivity
        satisfies: [R8, R9, R16]

error_to_outcome_map:
  - code: invalid_request
    http: 400
    user_visible_outcome: >
      Inline, field-scoped error on the offending add/edit control (R10); the
      form stays open and populated so nothing typed is lost.
  - code: not_found
    http: 404
    user_visible_outcome: >
      "No longer available" — the row is removed from the local grid without a
      crash or a retry (R11).
  - code: unauthenticated
    http: 401
    user_visible_outcome: >
      Session-expired state; any in-progress form's values are retained locally
      until the host re-authenticates and remounts this component (R13).
  - code: forbidden
    http: 403
    user_visible_outcome: >
      Not reachable through this unit's own UI — the role-gate presenter never
      renders a write control for a caller below Editor (R12/R28), so a 403
      would only occur via a stale client; treated the same as "no longer
      available" (R11) if it ever occurs.
  - code: rate_limited
    http: 429
    user_visible_outcome: >
      A "try again" state honoring the response's Retry-After header; the
      triggering control re-enables once that interval elapses (R18).
  - code: write_failed
    http: 503
    user_visible_outcome: >
      A write whose atomicity with its audit record failed upstream; treated
      the same as a timeout with unknown outcome — a list re-fetch to reconcile
      before any further write is permitted, never a blind retry (R15).
  - code: (none — connection failure or timeout)
    http: "n/a"
    user_visible_outcome: >
      On initial load: an error state with a retry action (R17). On a write
      whose outcome is unknown: a list re-fetch to reconcile before any further
      write is permitted, never a blind retry (R15).

not_consumed:
  - note: >
      This unit calls no other unit's contract. UNIT-CMS-0001 (auth/session) is
      a dependency but exposes no API this component calls directly — the
      bearer token and role are supplied by the host screen's already-established
      session, per requirements.md § Dependencies.
